[project]
name = "ecommerce-analytics-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "delta-spark==4.0.0",
    "pyspark==4.0.1",
    "pytest>=9.2.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["lakehouse"]

[tool.ruff]
line-length = 120
